# DigitalOcean App Platform - powers the "Deploy to DigitalOcean" button.
# App Platform has no persistent disks, so Soloblog keeps everything in
# an S3-compatible bucket (DigitalOcean Spaces works) and restores itself
# from it on every deploy. Fill in the S3_* values when asked.
spec:
  name: soloblog
  services:
    - name: web
      git:
        repo_clone_url: https://github.com/soloblog/soloblog.git
        branch: master
      dockerfile_path: Dockerfile
      http_port: 8080
      instance_count: 1
      instance_size_slug: basic-xxs
      health_check:
        http_path: /healthz
      envs:
        - key: ENV
          value: production
        - key: SESSION_SECRET
          type: SECRET
          value: ""
        - key: BASE_URL
          value: ${APP_URL}
        - key: S3_BUCKET
          value: ""
        - key: S3_ENDPOINT
          value: https://nyc3.digitaloceanspaces.com
        - key: S3_REGION
          value: nyc3
        - key: S3_ACCESS_KEY_ID
          type: SECRET
          value: ""
        - key: S3_SECRET_ACCESS_KEY
          type: SECRET
          value: ""
