# nginx in front of Soloblog. Replace blog.example.com and the
# certificate paths (certbot --nginx fills these in for you).
server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;

    # audio and video uploads go up to 100 MB (MAX_MEDIA_MB)
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # the original Host - fediverse servers sign it, and CSRF checks use it
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # appends the visitor's address last, which is what rate limiting reads
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # imports and backups can take a while
        proxy_read_timeout 300s;
    }
}
