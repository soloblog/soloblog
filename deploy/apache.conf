# Apache (2.4) in front of Soloblog - needs mod_proxy, mod_proxy_http,
# mod_headers and mod_ssl: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName blog.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/blog.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/blog.example.com/privkey.pem

    # keep the original Host - fediverse signatures and CSRF checks use it
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyTimeout 300

    # audio and video uploads go up to 100 MB
    LimitRequestBody 115343360
</VirtualHost>

<VirtualHost *:80>
    ServerName blog.example.com
    Redirect permanent / https://blog.example.com/
</VirtualHost>
