# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Soloblog
spec:
  description: A free, open source blog and website for one person, run on your own server or hosting account.
  icon: https://raw.githubusercontent.com/soloblog/soloblog/master/docs/brand/soloblog-icon-512.png
  coverImage: https://raw.githubusercontent.com/soloblog/soloblog/master/docs/brand/soloblog-social.png
  tags:
    - Blog
    - CMS
    - Website
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Domain
      description: The address your site opens at
  readme: |-
    # Soloblog

    Soloblog is a free, open source blog and website for one person, run on
    your own server or hosting account. Write in a calm editor, pick from 35
    colour palettes, and build pages from sections. Your posts are plain text
    files you own. Readers can comment, subscribe by email or follow from
    Mastodon, and members-only posts can be free or paid. Everything is kept
    in one folder, and backups are built in.

    ## After deploying

    Open your domain. First-time setup asks for a setup token: open this
    service's logs in Zeabur and copy it from the lines marked `[setup]`.
    Then choose your password, and keep the recovery key it gives you.

    ## Learn more

    - [User guide](https://github.com/soloblog/soloblog/blob/master/docs/guide/README.md)
    - [Website](https://soloblog.zrplus.net)
    - [Source code](https://github.com/soloblog/soloblog)
  services:
    - name: soloblog
      icon: https://raw.githubusercontent.com/soloblog/soloblog/master/docs/brand/soloblog-icon-512.png
      template: PREBUILT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          image: ghcr.io/soloblog/soloblog:1.0.0-beta
        ports:
          - id: web
            port: 8080
            type: HTTP
        volumes:
          - id: data
            dir: /data
        env:
          HOSTED_ON:
            default: Zeabur
