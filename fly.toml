# Rename the app before deploying: fly apps create your-blog-name
app = "your-blog-name"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  SITE_TITLE = "My Blog"
  # The address is the one first-time setup is opened at (change it in
  # Settings > Search engines); https://<app>.fly.dev until then. Set it
  # here only to fix it on the host - Settings can't change it then:
  # BASE_URL = "https://blog.example.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep it warm: a cold start makes the first visitor wait
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# everything - sqlite db, post markdown files, uploaded images - lives
# under /data, all on one volume. this app is deliberately single-writer:
# don't scale this past one machine or you'll get two sqlite files
# fighting over the same mount.
[[mounts]]
  source = "blog_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
