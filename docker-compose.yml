# Run Soloblog on any machine with Docker:
#
#   cp .env.example .env      # then set BASE_URL, your site's address
#   docker compose up -d
#   docker compose logs soloblog | grep setup   # first-run setup token
#
# Everything the blog stores (posts, database, uploads) lives in the
# soloblog-data volume. See docs/DEPLOYMENT.md for backups and updates.

services:
  soloblog:
    # :latest follows the master branch. Pin a release instead (e.g.
    # :1.0.0-beta) if you'd rather update on your own schedule.
    image: ghcr.io/soloblog/soloblog:latest
    # or build from this checkout instead of pulling the published image:
    # build: .
    container_name: soloblog
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      ENV: production
      DATA_DIR: /data
    volumes:
      - soloblog-data:/data
    labels:
      # only this container is updated by the optional Watchtower below
      com.centurylinklabs.watchtower.enable: "true"

  # Optional: the Update now button in Settings. Watchtower pulls the new
  # image and restarts Soloblog when Settings asks it to (and only this
  # container - the label below). To use it, uncomment these lines, set
  # WATCHTOWER_HTTP_API_TOKEN in .env to a long random string, and put
  # http://watchtower:8080/v1/update and that token in Settings > Integrations >
  # Updates. See docs/DEPLOYMENT.md > Updating.
  #
  # watchtower:
  #   image: nickfedor/watchtower:latest
  #   container_name: watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_HTTP_API_ENDPOINTS: update
  #     WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN}
  #     WATCHTOWER_HTTP_API_PERIODIC_POLLS: "false"
  #     WATCHTOWER_LABEL_ENABLE: "true"
  #     WATCHTOWER_CLEANUP: "true"

volumes:
  soloblog-data:
